# Redis配置
# 验收 L1：先启动 Redis 并完成 Tomcat 部署，再 stop redis 测推荐（勿重启 Tomcat）
# Session 已配置 NO_OP + listener 延迟启动；无 Redis 时应用仍可启动，Session 读写会降级到内存
redis.host=localhost
redis.port=6379
redis.password=
redis.database=0
redis.timeout=3000

# Jedis 连接池（压力测试下默认 maxTotal=8 易耗尽，导致 Unexpected end of stream）
redis.pool.maxTotal=400
redis.pool.maxIdle=80
redis.pool.minIdle=10
redis.pool.maxWaitMillis=3000

# MinIO配置
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=secondhand
