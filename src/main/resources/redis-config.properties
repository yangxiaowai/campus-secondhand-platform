# Redis配置
# 验收 L1：先启动 Redis 并完成 Tomcat 部署，再 stop redis 测推荐（勿重启 Tomcat）
# Session 已配置 NO_OP + listener 延迟启动；无 Redis 时应用仍可启动，Session 读写会降级到内存
redis.host=localhost
redis.port=6379
redis.password=
redis.database=0
# 连接超时（ms）：Redis 关闭时尽快失败并触发降级，避免长时间阻塞
redis.timeout=2000

# 业务 Redis 连接池（推荐、画像、索引等）— 压测留足余量
redis.pool.maxTotal=600
redis.pool.maxIdle=150
redis.pool.minIdle=50
redis.pool.maxWaitMillis=30000

# Session 专用池：建议 >= Tomcat maxThreads(200) 的 2 倍，与业务池隔离
redis.session.pool.maxTotal=400
redis.session.pool.maxIdle=150
redis.session.pool.minIdle=80
redis.session.pool.maxWaitMillis=30000

# MinIO配置
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=secondhand

# 分布式搜索索引
search.shard.count=3
search.index.ttl.seconds=604800
search.keyword.weight=0.6
search.semantic.weight=0.4

# 搜索列表二次排序（相关度 + 画像匹配 + 时效 + 价格）
search.rank.weight.relevance=0.40
search.rank.weight.match=0.25
search.rank.weight.freshness=0.20
search.rank.weight.price=0.15
search.rank.freshness.halfLifeDays=30

# 真实 Embedding（优先级：Ollama > OpenAI 兼容 > 本地 n-gram）
# nomic-embed-text 维度为 768；须与 DIM 一致，切换模型后务必改 DIM 并重建搜索索引
search.embedding.dimensions=768
search.embedding.ollama.enabled=true
search.embedding.ollama.base-url=http://127.0.0.1:11434
search.embedding.ollama.model=nomic-embed-text
search.embedding.openai.enabled=false
search.embedding.openai.base-url=
search.embedding.openai.api-key=
search.embedding.openai.model=text-embedding-3-small

# Redis Stack / RediSearch 向量索引（需 redis-stack-server 镜像）
search.redis-stack.enabled=true
